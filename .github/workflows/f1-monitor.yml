name: F1 Sepang ticket monitor

on:
  schedule:
    # Every 5 minutes. This is GitHub's minimum granularity, and runs are
    # frequently delayed 5-20 min during peak load. See notes in README.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # lets you trigger manually to test

# Only one run at a time, and don't queue up a backlog if runs are slow.
concurrency:
  group: f1-monitor
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the state file back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install requests

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python f1_monitor_v3.py --once

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain f1_state.json)" ]]; then
            git config user.name  "f1-monitor"
            git config user.email "actions@github.com"
            git add f1_state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # rebase in case a previous run raced us
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          else
            echo "no change"
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: f1_monitor.log
          retention-days: 3
          if-no-files-found: ignore